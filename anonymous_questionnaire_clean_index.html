<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anonymous Questionnaire</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #f7d8ff, #dce8ff);
  min-height: 100vh;
  color: #25202b;
}
.wrap { max-width: 720px; margin: auto; padding: 28px 16px 50px; }
.card {
  background: rgba(255,255,255,.95);
  border-radius: 28px;
  padding: 28px;
  box-shadow: 0 18px 50px rgba(70,45,90,.15);
}
h1 { text-align: center; margin: 0 0 8px; font-size: 30px; }
.sub { text-align: center; margin: 0 0 26px; color: #6d6372; }
.note {
  background: #f5eff8;
  border-radius: 16px;
  padding: 14px 16px;
  margin-bottom: 24px;
  font-size: 14px;
}
.q { margin: 22px 0; }
label { display: block; font-weight: 650; margin-bottom: 9px; }
textarea {
  width: 100%;
  min-height: 92px;
  border: 1.5px solid #d8cfe0;
  border-radius: 15px;
  padding: 13px;
  font: inherit;
  resize: vertical;
  background: white;
}
textarea:focus {
  outline: none;
  border-color: #9d73b5;
}
button {
  width: 100%;
  border: 0;
  border-radius: 16px;
  padding: 15px;
  font-size: 16px;
  font-weight: 700;
  background: #7f58a3;
  color: white;
  cursor: pointer;
}
button:disabled { opacity: .65; }
#thanks { display: none; text-align: center; padding: 35px 10px; }
.small { font-size: 12px; color: #7b7180; text-align: center; margin-top: 14px; }
.error {
  display: none;
  background: #ffe8e8;
  color: #8b2d2d;
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 18px;
}
</style>
</head>

<body>
<div class="wrap">
<div class="card">

<h1>Anonymous Questionnaire</h1>
<p class="sub">Be honest... nobody will know it was you 👀</p>

<div class="note">
<strong>Anonymous:</strong> No name or email is requested.
</div>

<div id="error" class="error">
Something went wrong. Please try submitting again.
</div>

<form id="form" action="https://formspree.io/f/mrpgzbal" method="POST">

<div class="q">
<label>1. What's the weirdest thing someone has told you?</label>
<textarea name="Question 1" required></textarea>
</div>

<div class="q">
<label>2. Give me jokes.</label>
<textarea name="Question 2" required></textarea>
</div>

<div class="q">
<label>3. What's your opinion on the social media ban?</label>
<textarea name="Question 3" required></textarea>
</div>

<div class="q">
<label>4. If you agree with 3, you're a bloke.</label>
<textarea name="Question 4"></textarea>
</div>

<div class="q">
<label>5. Who's the most dramatic person you know?</label>
<textarea name="Question 5" required></textarea>
</div>

<div class="q">
<label>6. What's something you hate and love at the same time?</label>
<textarea name="Question 6" required></textarea>
</div>

<div class="q">
<label>7. What's the funniest argument you've witnessed?</label>
<textarea name="Question 7" required></textarea>
</div>

<div class="q">
<label>8. Bait someone out right now 👀</label>
<textarea name="Question 8" required></textarea>
</div>

<div class="q">
<label>9. If you could bring back beef, who would it be between?</label>
<textarea name="Question 9" required></textarea>
</div>

<div class="q">
<label>10. Are you ready for school?</label>
<textarea name="Question 10" required></textarea>
</div>

<button id="submit" type="submit">Submit anonymously</button>
</form>

<div id="thanks">
<h2>Submitted!</h2>
<p>Your answers have been sent anonymously. Thank you!</p>
</div>

<p class="small">No name or email field is included.</p>

</div>
</div>

<script>
const form = document.getElementById("form");
const button = document.getElementById("submit");

form.addEventListener("submit", async function(event) {
  event.preventDefault();
  button.disabled = true;
  button.textContent = "Sending...";

  try {
    const response = await fetch(form.action, {
      method: "POST",
      body: new FormData(form),
      headers: { "Accept": "application/json" }
    });

    if (!response.ok) throw new Error();

    form.style.display = "none";
    document.getElementById("thanks").style.display = "block";
  } catch (error) {
    document.getElementById("error").style.display = "block";
    button.disabled = false;
    button.textContent = "Submit anonymously";
  }
});
</script>

</body>
</html>
